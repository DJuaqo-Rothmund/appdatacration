name: Android APK

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias del núcleo
        run: pip install jinja2 pillow numpy pypdf pytest
      - name: Pruebas (BD, semanas, IA, PIN, recordatorios, informes)
        run: pytest -q

  apk:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev automake build-essential ccache lld
      - name: Buildozer
        run: pip install "cython<3.1" buildozer==1.6.0 setuptools
      - name: Caché de SDK/NDK y compilaciones
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-
      - name: Compilar APK (debug)
        run: yes | buildozer -v android debug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: fenorubus-apk
          path: bin/*.apk
          if-no-files-found: error
